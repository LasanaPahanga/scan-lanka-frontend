# One-VPS layout:
#   Next.js  → 127.0.0.1:3000   (public site)
#   Spring   → 127.0.0.1:8080   (API, already running)
#
# Install:
#   sudo cp deploy/nginx-canvasboards.conf /etc/nginx/sites-available/canvasboards
#   sudo ln -sf /etc/nginx/sites-available/canvasboards /etc/nginx/sites-enabled/canvasboards
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS: certbot --nginx -d www.canvasboards.lk -d canvasboards.lk

server {
    listen 80;
    listen [::]:80;
    server_name canvasboards.lk www.canvasboards.lk;

    # ACME / later replaced by Certbot HTTPS server blocks
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.canvasboards.lk$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name canvasboards.lk;

    # ssl_certificate /etc/letsencrypt/live/www.canvasboards.lk/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/www.canvasboards.lk/privkey.pem;

    return 301 https://www.canvasboards.lk$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.canvasboards.lk;

    # ssl_certificate /etc/letsencrypt/live/www.canvasboards.lk/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/www.canvasboards.lk/privkey.pem;

    client_max_body_size 25m;

    # Browser /api/* → Spring on the same VPS (cookies stay first-party)
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
